<script>
// =====================================================
// BASE DE DONNÉES IndexedDB
// =====================================================
const DB_NAME = 'QuranLearningDB';
const DB_VERSION = 1;
const STORE_NAME = 'biblio';
const DATA_FLAG = 'data'; // Marqueur pour identifier la base

let db = null;

// Ouvrir / initialiser IndexedDB
function openDB() {
 return new Promise((resolve, reject) => {
 const request = indexedDB.open(DB_NAME, DB_VERSION);

 request.onupgradeneeded = (e) => {
 const database = e.target.result;
 if (!database.objectStoreNames.contains(STORE_NAME)) {
 const store = database.createObjectStore(STORE_NAME, { keyPath: 'id' });
 store.createIndex('title', 'title', { unique: false });
 store.createIndex('type', 'type', { unique: false });
 store.createIndex('dateAdded', 'dateAdded', { unique: false });
 }
 };

 request.onsuccess = (e) => {
 db = e.target.result;
 resolve(db);
 };

 request.onerror = (e) => reject(e.target.error);
 });
 }

// Ajouter une ressource
function addResource(resource) {
 return new Promise((resolve, reject) => {
 const tx = db.transaction([STORE_NAME], 'readwrite');
 const store = tx.objectStore(STORE_NAME);
 const request = store.add(resource);
 request.onsuccess = () => resolve(resource.id);
 request.onerror = (e) => reject(e.target.error);
 });
 }

// Récupérer toutes les ressources
function getAllResources() {
 return new Promise((resolve, reject) => {
 const tx = db.transaction([STORE_NAME], 'readonly');
 const store = tx.objectStore(STORE_NAME);
 const request = store.getAll();
 request.onsuccess = () => resolve(request.result);
 request.onerror = (e) => reject(e.target.error);
 });
 }

// Récupérer une ressource par ID
function getResource(id) {
 return new Promise((resolve, reject) => {
 const tx = db.transaction([STORE_NAME], 'readonly');
 const store = tx.objectStore(STORE_NAME);
 const request = store.get(id);
 request.onsuccess = () => resolve(request.result);
 request.onerror = (e) => reject(e.target.error);
 });
 }

// Supprimer une ressource
function deleteResource(id) {
 return new Promise((resolve, reject) => {
 const tx = db.transaction([STORE_NAME], 'readwrite');
 const store = tx.objectStore(STORE_NAME);
 const request = store.delete(id);
 request.onsuccess = () => resolve();
 request.onerror = (e) => reject(e.target.error);
 });
 }

// Vider la bibliothèque
function clearAllResources() {
 return new Promise((resolve, reject) => {
 const tx = db.transaction([STORE_NAME], 'readwrite');
 const store = tx.objectStore(STORE_NAME);
 const request = store.clear();
 request.onsuccess = () => resolve();
 request.onerror = (e) => reject(e.target.error);
 });
 }

// =====================================================
// CONVERSION DES FICHIERS VERS JSON
// =====================================================

// Convertir un fichier en ressource JSON compatible IndexedDB
async function fileToResource(file) {
 const id = 'res_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
 const dateAdded = new Date().toISOString();

 const extension = file.name.split('.').pop().toLowerCase();
 let type = 'unknown';
 let payload = {};
 let textContent = '';

 if (['txt', 'md'].includes(extension)) {
 // Document textuel
 type = 'text';
 textContent = await file.text();
 payload = {
 content: textContent,
 preview: textContent.substring(0, 500)
 };
 } else if (extension === 'mp3') {
 // Audio MP3 -> JSON (Base64)
 type = 'audio';
 const buffer = await file.arrayBuffer();
 const base64 = arrayBufferToBase64(buffer);
 payload = {
 data: base64,
 mimeType: 'audio/mpeg',
 preview: '🎵 Fichier audio MP3'
 };
 } else if (extension === 'mp4') {
 // Vidéo MP4 -> JSON (Base64)
 type = 'video';
 const buffer = await file.arrayBuffer();
 const base64 = arrayBufferToBase64(buffer);
 payload = {
 data: base64,
 mimeType: 'video/mp4',
 preview: '🎬 Fichier vidéo MP4'
 };
 } else if (extension === 'json') {
 // JSON existant
 type = 'json';
 textContent = await file.text();
 try {
 payload = JSON.parse(textContent);
 payload.preview = JSON.stringify(payload).substring(0, 500);
 } catch (e) {
 payload = { content: textContent, preview: textContent.substring(0, 500) };
 }
 }

 return {
 id,
 title: file.name.replace(/\.[^/.]+$/, ''),
 filename: file.name,
 type,
 extension,
 size: file.size,
 dateAdded,
 mimeType: file.type || 'application/octet-stream',
 dataFlag: DATA_FLAG,
 ...payload
 };
 }

// Conversion ArrayBuffer -> Base64
function arrayBufferToBase64(buffer) {
 let binary = '';
 const bytes = new Uint8Array(buffer);
 const len = bytes.byteLength;
 for (let i = 0; i < len; i++) {
 binary += String.fromCharCode(bytes[i]);
 }
 return btoa(binary);
 }

// Conversion Base64 -> Blob (pour téléchargement)
function base64ToBlob(base64, mimeType) {
 const binary = atob(base64);
 const len = binary.length;
 const bytes = new Uint8Array(len);
 for (let i = 0; i < len; i++) {
 bytes[i] = binary.charCodeAt(i);
 }
 return new Blob([bytes], { type: mimeType });
 }

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Convertisseur & Bibliothèque Biblio</title>
<style>
  body {font-family: Arial, sans-serif; margin:0; padding:0; background:#fafafa;}
  header {background:#fff; padding:10px 20px; border-bottom:1px solid #ddd; display:flex; align-items:center;}
  header h1 {margin:0; font-size:1.2rem; color:#1565c0;}
  header .data-tag {margin-left:auto; font-weight:bold; color:#1565c0;}
  #statusBar {position:fixed; top:0; left:0; right:0; padding:8px 20px; font-size:0.9rem; opacity:0; transition:opacity .3s;}
  #statusBar.show {opacity:1;}
  main {padding:20px;}
  .file-list {margin-top:10px;}
  .file-item {margin-bottom:5px; font-size:0.9rem;}
  .btn {padding:6px 12px; margin-right:5px; background:#1565c0; color:#fff; border:none; cursor:pointer;}
  .btn:hover {background:#0d47a1;}

<body>
<header>
  <h1>Convertisseur & Bibliothèque</h1>
  <span class="data-tag">data</span>
</header>
<div id="statusBar"></div>
<main>
  <input type="file" id="fileInput" multiple>
  <button class="btn" id="exportBtn">Exporter DB</button>
  <button class="btn" id="importBtn">Importer DB</button>
  <input type="file" id="importFile" accept=".json" style="display:none;">
  <div class="file-list" id="fileList"></div>
  <textarea id="jsonOutput" placeholder="JSON généré apparaîtra ici…" readonly></textarea>
</main>

<script>
/* ---------- IndexedDB ---------- */
const DB_NAME = 'biblioDB';
const STORE_NAME = 'resources';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = e => {
      const db = e.target.result;
      db.createObjectStore(STORE_NAME, {keyPath: 'id', autoIncrement:true});
    };
    request.onsuccess = e => { db = e.target.result; resolve(); };
    request.onerror = e => reject(e.target.error);
  });
}

/* ---------- UI helpers ---------- */
const statusBar = document.getElementById('statusBar');
function showStatus(msg, type='info'){
  const colors={info:'#1565c0',success:'#2e7d32',error:'#c62828'};
  statusBar.style.background='#fff';
  statusBar.style.color=colors[type]||colors.info;
  statusBar.textContent=msg;
  statusBar.classList.add('show');
  setTimeout(()=>statusBar.classList.remove('show'),3000);
}

/* ---------- File handling ---------- */
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const jsonOutput = document.getElementById('jsonOutput');

fileInput.addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  fileList.innerHTML = '';
  for(const f of files){
    const li = document.createElement('div');
    li.className='file-item';
    li.textContent=`${f.name} (${(f.size/1024).toFixed(1)} KB)`;
    fileList.appendChild(li);
  }
  const json = await convertFilesToJSON(files);
  jsonOutput.value = JSON.stringify(json, null, 2);
  await storeResources(json);
  showStatus('Conversion & sauvegarde réussies','success');
});

/* ---------- Conversion logic ---------- */
async function convertFilesToJSON(files){
  const result = [];
  for(const file of files){
    const ext = file.name.split('.').pop().toLowerCase();
    const base64 = await fileToBase64(file);
    const entry = {
      filename: file.name,
      type: file.type || 'application/octet-stream',
      size: file.size,
      encoding: 'base64',
      data: base64
    };
    if(ext === 'txt' || ext === 'json' || ext === 'md'){
      const text = await file.text();
      entry.textContent = text;
    }
    result.push(entry);
  }
  return result;
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const binary = reader.result;
      const base64 = btoa(
        new Uint8Array(binary)
          .reduce((data, byte) => data + String.fromCharCode(byte), '')
      );
      resolve(base64);
    };
    reader.onerror = e => reject(e);
    reader.readAsArrayBuffer(file);
  });
}

/* ---------- IndexedDB storage ---------- */
async function storeResources(resources){
  const tx = db.transaction(STORE_NAME, 'readwrite');
  const store = tx.objectStore(STORE_NAME);
  for(const res of resources){
    await new Promise((res,rej)=>store.add(res).onsuccess=res).onerror=rej);
  }
  return tx.complete;
}

/* ---------- Export / Import ---------- */
document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const all = await getAllResources();
  const blob = new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='biblio_export.json'; a.click();
  URL.revokeObjectURL(url);
  showStatus('Base exportée','success');
});

document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());

document.getElementById('importFile').addEventListener('change', async e=>{
  const file = e.target.files[0];
  if(!file) return;
  const text = await file.text();
  let data;
  try{ data = JSON.parse(text); }catch{ showStatus('Fichier JSON invalide','error'); return; }
  const tx = db.transaction(STORE_NAME,'readwrite');
  const store = tx.objectStore(STORE_NAME);
  for(const item of data){
    await new Promise((res,rej)=>store.add(item).onsuccess=res).onerror=rej);
  }
  showStatus('Importation réussie','success');
});

function getAllResources(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = e => reject(e.target.error);
  });
}

/* ---------- Init ---------- */
openDB().then(()=>showStatus('Base prête','info')).catch(e=>showStatus('Erreur d\'ouverture DB','error'));
</script>
